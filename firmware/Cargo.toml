[package]
name = "pico-thing-firmware"
version = "0.1.0"
edition = "2024"
publish = false
description = "pico-thing on the Pico W: runs the `thing` app on the Pico-ResTouch-LCD-3.5"

[dependencies]
thing = { path = "../core" }
ratatui = { version = "0.30.2", default-features = false, features = ["portable-atomic", "layout-cache"] }
embassy-rp = { version = "0.10.0", features = ["rp2040", "time-driver", "critical-section-impl", "boot2-w25q080"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = "0.5.1"
embassy-usb = "0.6.0"
embassy-sync = "0.8.0"
embassy-futures = "0.1"
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.7"
embedded-alloc = "0.7.0"
embedded-graphics = "0.8.2"
embedded-graphics-unicodefonts = "0.2.0"
portable-atomic = { version = "1.15.0", features = ["critical-section"] }
static_cell = "2.1.1"
fixed = "1"
cyw43 = { version = "0.7.0", features = ["firmware-logs"] }
cyw43-pio = "0.10.0"
cyw43-firmware = { version = "0.1.0", features = ["wifi"] }
embassy-net = { version = "0.9.1", features = ["tcp", "udp", "dns", "dhcpv4", "proto-ipv4", "medium-ethernet"] }
embedded-io-async = "0.7.0"
sequential-storage = "8.0.2"
embassy-embedded-hal = "0.6.0"
embedded-storage-async = "0.4.2"
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
debug = 2
codegen-units = 1

[profile.dev]
opt-level = "s"

[patch.crates-io]
ratatui-widgets = { path = "../patches/ratatui-widgets" }
