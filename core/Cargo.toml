[package]
name = "thing"
version = "0.1.0"
edition = "2024"
publish = false
description = "pico-thing's app: screens, state and services, independent of hardware"

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["portable-atomic", "layout-cache"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
# miIO (Xiaomi lights): AES-128-CBC with MD5-derived keys
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
md-5 = { version = "0.10", default-features = false }

[build-dependencies]
toml = { version = "0.9", features = ["preserve_order"] }

[dev-dependencies]
# The layout cache locks with a critical section; on the Mac that's a std mutex
critical-section = { version = "1", features = ["std"] }
serde_json = "1"

[patch.crates-io]
ratatui-widgets = { path = "../patches/ratatui-widgets" }
