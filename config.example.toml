# pico-thing settings. Copy to config.toml and fill in; config.toml is gitignored.

wifi_ssid = "your-network"
wifi_password = "your-password"

# Leave these out to look them up from your public IP
# latitude = 0.0
# longitude = 0.0
# city = "Nairobi"
units = "C"  # "C" or "F"

# The Mac companion (companion/server.py). The token must match companion/config.json,
# which the server creates on its first run.
companion = "http://192.168.1.8:8765"
companion_token = ""

# Yeelights (LAN Control on) as IP = name. Reserve the IPs in your router.
[lights]
# "192.168.1.13" = "Corner lamp"

# Xiaomi-ecosystem lights (no Yeelight LAN Control), over miIO: IP = 32-hex-char token
[miio_tokens]
# "192.168.1.14" = "0123456789abcdef0123456789abcdef"

# Sonos speakers, in the order they're listed on the Pico
# [[sonos]]
# name = "Living room"
# ip = "192.168.1.5"

# Quotes for the Productivity face (the built-in ones are used if this is empty).
# Up to ~50 characters fits on two lines; plain ASCII only.
[productivity]
# quotes = ["Lock in."]
